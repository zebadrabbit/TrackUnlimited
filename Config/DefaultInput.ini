; ===================== F1-F5 ARE OURS, AND THIS IS WHERE THEY WERE LOST =====================
;
; The inspection keys sit on F1-F6 (settings, overlays, diagnostics, the console,
; the graph, its channel). F1 opened the settings AND flipped the world to
; wireframe, and this project spent a long time believing that was the EDITOR
; answering to the same press. It was not. The editor's view modes are Alt+2,
; Alt+3 and Alt+4 (FEditorViewportCommands) and it never wanted F1 at all.
;
; They are DebugExecBindings in Engine/Config/BaseInput.ini, run by our own
; UPlayerInput out of config in every non-Shipping build -- so "run standalone"
; never avoided it either, and a Slate input preprocessor sitting in front of the
; editor's command list was guarding a door nothing was coming through.
;
; Removed here rather than in the engine's BaseInput.ini, which is somebody
; else's install, is not in this repository (constraint 4) and would be gone the
; next time they update. The text must match BaseInput.ini's line for line,
; F1's bIgnoreShift included, or the removal silently does nothing.
;
; F6 has no binding to remove. F9 ("shot showui") and F11 (immersive, fullscreen)
; are left alone because nothing here is bound to them and both are useful while
; playing -- take one only when a key is actually wanted.
[/Script/Engine.PlayerInput]
-DebugExecBindings=(Key=F1,Command="viewmode wireframe", bIgnoreShift=True)
-DebugExecBindings=(Key=F2,Command="viewmode unlit")
-DebugExecBindings=(Key=F3,Command="viewmode lit")
-DebugExecBindings=(Key=F4,Command="viewmode lit_detaillighting")
-DebugExecBindings=(Key=F5,Command="viewmode shadercomplexity")
