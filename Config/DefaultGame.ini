[/Script/UnrealEd.ProjectPackagingSettings]
; COOK IT EXPLICITLY. GameDefaultMap makes the engine open it; this is what puts
; it in the package to be opened. They are separate settings and missing either
; one fails the same way from the player's side.
+MapsToCook=(FilePath="/Game/Maps/VerticalSlice")

[/Script/Engine.AssetManagerSettings]
; THE COOK COOKED, AND THEN FAILED ON A SUBSYSTEM THIS PROJECT DOES NOT USE.
; GameFeaturesSubsystem::OnAssetManagerCreated logs an ERROR when the Asset
; Manager holds no rule for GameFeatureData, and the cook commandlet counts
; logged errors as failure -- so the package died after "Done!", with the ride
; already cooked. Nothing here is a game feature: the module is loaded because
; the editor-only AllToolsets plugin depends on GameFeaturesToolset.
;
; REGISTERING THE TYPE IS THE WHOLE FIX, and the rules below being all-default
; does not weaken it: GetPrimaryAssetRules forces a *registered* type's Priority
; from -1 to 1, so the rules stop reading as default and the check passes.
;
; bIsEditorOnly=True IS LOAD-BEARING, not tidiness. ShouldScanPrimaryAssetType
; tests it BEFORE FillRuntimeData, so outside the editor the entry is skipped
; whole -- which matters because the packaged game has no GameFeatures module
; to resolve AssetBaseClass against, and FillRuntimeData ensures on a class it
; cannot load. Editor-only, so the cook still registers it and the ship does not
; carry an ensure added to fix a cook.
;
; The scan path deliberately does not exist. A missing path is silent here (the
; Asset Manager's only "does not exist" error is about chunks), and there are no
; GameFeatureData assets to find in any path we could name instead.
+PrimaryAssetTypesToScan=(PrimaryAssetType="GameFeatureData",AssetBaseClass="/Script/GameFeatures.GameFeatureData",bHasBlueprintClasses=False,bIsEditorOnly=True,Directories=((Path="/Game/Unused")),SpecificAssets=,Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=True,CookRule=Unknown))
