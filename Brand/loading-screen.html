<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TrackUnlimited — loading screen</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/* TrackUnlimited — design tokens. Dark CAD / control-room.
   Contrast ratios in comments are measured against --tu-ground (#0B0E11). */
:root {
  /* ground plane */
  --tu-black:  #06080A;
  --tu-ground: #0B0E11;   /* page / loading-screen field */
  --tu-panel:  #10151A;   /* raised surface, title blocks, cards */
  --tu-raised: #161D24;   /* hover / active surface */

  /* rules and grid */
  --tu-grid-minor: #18212A;
  --tu-grid-major: #24313B;
  --tu-rule:       #2C3A45;

  /* type */
  --tu-text:  #E8F2F8;    /* 17.0 : 1 */
  --tu-text-2:#93A6B4;    /*  7.7 : 1 */
  --tu-text-3:#78899A;    /*  5.4 : 1  — smallest permitted text colour */

  /* line work */
  --tu-line:     #7FD8FF; /* 12.1 : 1 — primary geometry */
  --tu-line-dim: #3E7E9B; /*  4.3 : 1 — construction / axis lines */

  /* signal accents — borrowed from the ride-control panel */
  --tu-amber: #FFB020;    /* 10.6 : 1 — lift / powered / attention */
  --tu-red:   #FF5C4D;    /*  6.4 : 1 — block OCCUPIED, over-limit G */
  --tu-green: #4ADE80;    /* 11.1 : 1 — block CLEAR, pass */
  --tu-violet:#B79CFF;    /*  8.5 : 1 — fourth data series only */

  /* line weights — a three-weight system, as on a real drawing */
  --tu-w-thin:  1px;      /* grid, construction, extension lines */
  --tu-w-med:   1.6px;    /* dimension lines, borders, secondary geometry */
  --tu-w-thick: 3px;      /* the subject of the drawing: the track itself */

  /* type stack. IBM Plex Mono / JetBrains Mono are the intended purchases;
     the stack degrades to the system technical mono with no webfont fetch. */
  --tu-mono: "IBM Plex Mono", "JetBrains Mono", ui-monospace, "SF Mono",
             "Cascadia Mono", "Roboto Mono", Consolas, "Liberation Mono", monospace;
  --tu-sans: "Inter", "Helvetica Neue", Arial, system-ui, sans-serif;

  --tu-track: 0.14em;     /* label letterspacing */
}

* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; background: var(--tu-black); overflow: hidden;
  font-family: var(--tu-mono); color: var(--tu-text);
}
#stage { position: fixed; inset: 0; display: grid; place-items: center; }
svg#sheet { width: 100vw; height: 100vh; display: block; }
text { font-family: var(--tu-mono); }
.lbl  { font-size: 13px; letter-spacing: var(--tu-track); fill: var(--tu-text-3); }
.lbl2 { font-size: 14px; letter-spacing: .08em;  fill: var(--tu-text-2); }
.val  { font-size: 15px; letter-spacing: .04em;  fill: var(--tu-text); }
.dim  { font-size: 13px; letter-spacing: .06em;  fill: var(--tu-line); }
.tiny { font-size: 11px; letter-spacing: .16em;  fill: var(--tu-text-3); }
.fade { opacity: 0; transition: opacity .5s ease; }
.fade.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .fade { transition: none; } }
</style>
</head>

dimV(crestX + 110, py(TU.meta.crest), PLOT.datum, TU.meta.crest.toFixed(2) + ' m', gDim);
dimH(PLOT.datum + 70, PLOT.x0, PLOT.x1,
     TU.meta.horizontalExtent.toFixed(2) + ' m HORIZONTAL', gDim);

// feature callouts
const gCall = el('g', { class: 'fade' }, gSec);
function nearestIdx(s) {
  let best = 0, d = 1e9;
  for (let i = 0; i < TU.S.length; i++) { const e = Math.abs(TU.S[i] - s); if (e < d) { d = e; best = i; } }
  return best;
}
const CALLOUT_Y = [188, 148, 232, 148, 196];
TU.marks.forEach((mk, i) => {
  const idx = nearestIdx(mk.s);
  const x = px(TU.X[idx]), y = py(TU.Z[idx]);
  const ly = CALLOUT_Y[i % CALLOUT_Y.length];
  // lean the leader away from whichever sheet edge is closer
  let dir = i === 2 ? 1 : -1;
  if (x + 160 > PLOT.x1) dir = -1;
  if (x - 160 < PLOT.x0) dir = 1;
  const lx = x + dir * 54;
  el('path', { d: `M ${x} ${y - 8} L ${lx} ${ly + 14} L ${lx + dir * 92} ${ly + 14}`,
    fill: 'none', stroke: 'var(--tu-line-dim)', 'stroke-width': 1 }, gCall);
  el('circle', { cx: x, cy: y, r: 3.5, fill: 'none', stroke: 'var(--tu-amber)',
    'stroke-width': 1.4 }, gCall);
  const anchor = dir > 0 ? 'start' : 'end';
  const tx = dir > 0 ? lx + 6 : lx - 6;
  txt(mk.label, tx, ly, 'lbl', { 'text-anchor': anchor }, gCall);
  txt(mk.detail, tx, ly + 22, 'val', { 'text-anchor': anchor, fill: 'var(--tu-line)' }, gCall);
});

// segment vocabulary — what the authored list is actually made of
const gVocab = el('g', { class: 'fade' }, gSec);
(function vocab() {
  const X = 152, Y = 168, W = 300, ROW = 26;
  const rows = [['STRAIGHT', 4], ['CLOTHOID', 2], ['ARC', 1], ['RAW (PITCH)', 9]];
  el('rect', { x: X, y: Y, width: W, height: 30 + rows.length * ROW + 30,
    fill: 'var(--tu-panel)', stroke: 'var(--tu-grid-major)', 'stroke-width': 1 }, gVocab);
  txt('SEGMENT VOCABULARY', X + 14, Y + 22, 'tiny', {}, gVocab);
  el('line', { x1: X, y1: Y + 32, x2: X + W, y2: Y + 32,
    stroke: 'var(--tu-grid-major)', 'stroke-width': 1 }, gVocab);
  rows.forEach((r, i) => {
    const y = Y + 32 + (i + 1) * ROW - 8;
    txt(r[0], X + 14, y, 'lbl', { fill: 'var(--tu-text-2)' }, gVocab);
    txt(String(r[1]), X + W - 14, y, 'val', { 'text-anchor': 'end', fill: 'var(--tu-line)' }, gVocab);
  });
  const y2 = Y + 32 + rows.length * ROW + 4;
  el('line', { x1: X, y1: y2, x2: X + W, y2: y2, stroke: 'var(--tu-grid-major)',
    'stroke-width': 1 }, gVocab);
  txt('TOTAL', X + 14, y2 + 20, 'tiny', {}, gVocab);
  txt('16', X + W - 14, y2 + 21, 'val', { 'text-anchor': 'end' }, gVocab);
})();

// zone strip ------------------------------------------------------------------
const gZone = el('g', { class: 'fade' });
TU.zones.forEach(z => {
  // strip is laid out by arc length, not by X, because the layout doubles back
  const a = TR_X0 + (z.s0 / TU.meta.developedLength) * (TR_X1 - TR_X0);
  const b = TR_X0 + (z.s1 / TU.meta.developedLength) * (TR_X1 - TR_X0);
  el('rect', { x: a, y: 556, width: b - a - 2, height: 20, fill: 'var(--tu-panel)',
    stroke: ZONE_COLOUR[z.kind], 'stroke-width': 1 }, gZone);
  el('rect', { x: a, y: 556, width: 3, height: 20, fill: ZONE_COLOUR[z.kind] }, gZone);
  if (b - a > 90) txt(z.name, a + 12, 571, 'tiny', {}, gZone);
});
txt('ZONES BY ARC LENGTH — 0 to ' + TU.meta.developedLength.toFixed(2) + ' m DEVELOPED',
    TR_X1 + 16, 571, 'tiny', {}, gZone);

// block indicator row ---------------------------------------------------------
const gBlocks = el('g', { class: 'fade' });
txt('BLOCK STATE · PHASE 3 PREVIEW, DRIVEN FROM THE ZONE LIST', TR_X0, 616, 'tiny', {}, gBlocks);
const lamps = [];
TU.zones.forEach((z, i) => {
  const w = 210, x = TR_X0 + i * (w + 14), y = 626;
  el('rect', { x, y, width: w, height: 40, fill: 'var(--tu-panel)',
    stroke: 'var(--tu-grid-major)', 'stroke-width': 1 }, gBlocks);
  const lamp = el('rect', { x: x + 10, y: y + 13, width: 14, height: 14,
    fill: 'var(--tu-green)', opacity: .25 }, gBlocks);
  const st = txt('CLEAR', x + 34, y + 25, 'lbl', { fill: 'var(--tu-text-2)' }, gBlocks);
  txt(z.id, x + w - 12, y + 25, 'tiny', { 'text-anchor': 'end' }, gBlocks);
  lamps.push({ lamp, st, z });
});

// trace panels ----------------------------------------------------------------
const gTrace = el('g', { class: 'fade' });
const tracePaths = [];
TRACE.forEach(t => {
  el('rect', { x: TR_X0, y: t.y0, width: TR_X1 - TR_X0, height: t.y1 - t.y0,
    fill: 'var(--tu-panel)', stroke: 'var(--tu-grid-major)', 'stroke-width': 1 }, gTrace);
  txt(t.label, TR_X0 + 12, t.y0 + 22, 'tiny', {}, gTrace);
  const ty = v => t.y1 - (v - t.min) / (t.max - t.min) * (t.y1 - t.y0);
  // zero / unity reference
  const ref = t.key === 'G' ? [0, 1] : [50];
  ref.forEach(r => {
    el('line', { x1: TR_X0, y1: ty(r), x2: TR_X1, y2: ty(r), stroke: 'var(--tu-grid-major)',
      'stroke-width': 1, 'stroke-dasharray': r === 0 ? '' : '3 5' }, gTrace);
    txt(r + (t.key === 'G' ? '' : ''), TR_X1 + 8, ty(r) + 4, 'tiny', {}, gTrace);
  });
  const pts = TU.TS.map((s, i) => {
    const x = TR_X0 + (s / TU.meta.developedLength) * (TR_X1 - TR_X0);
    return x.toFixed(1) + ',' + ty(TU[t.key][i]).toFixed(1);
  });
  const p = el('polyline', { points: pts.join(' '), fill: 'none', stroke: t.colour,
    'stroke-width': 2, 'stroke-linejoin': 'round' }, gTrace);
  tracePaths.push(p);
  txt(t.max + ' ' + t.unit, TR_X1 + 8, t.y0 + 12, 'tiny', {}, gTrace);
  txt(t.min + ' ' + t.unit, TR_X1 + 8, t.y1, 'tiny', {}, gTrace);
  t.ty = ty;
});

// live cursors on the traces + the train on the section
const gLive = el('g', { class: 'fade' });
const cursor = el('line', { y1: TRACE[0].y0, y2: TRACE[1].y1, stroke: 'var(--tu-amber)',
  'stroke-width': 1, x1: TR_X0, x2: TR_X0 }, gLive);
const trainG = el('g', {}, gLive);
el('path', { d: 'M -9 -9 L 9 -9 L 9 9 L -9 9 Z', fill: 'var(--tu-ground)',
  stroke: 'var(--tu-amber)', 'stroke-width': 2 }, trainG);
el('path', { d: 'M -14 0 L -20 0 M 14 0 L 20 0 M 0 -14 L 0 -20 M 0 14 L 0 20',
  stroke: 'var(--tu-amber)', 'stroke-width': 1 }, trainG);
const readout = el('g', {}, gLive);
el('rect', { x: 16, y: -46, width: 176, height: 62, fill: 'var(--tu-panel)',
  stroke: 'var(--tu-amber)', 'stroke-width': 1, opacity: .96 }, readout);
const roS = txt('', 28, -28, 'tiny', {}, readout);
const roV = txt('', 28, -8, 'val', { fill: 'var(--tu-line)' }, readout);
const roG = txt('', 28, 10, 'val', { fill: 'var(--tu-amber)' }, readout);

// ---------------------------------------------------------------- title block
const tb = el('g', { class: 'fade' });
const TBX = 1330, TBY = 930, TBW = 546, TBH = 106;
el('rect', { x: TBX, y: TBY, width: TBW, height: TBH, fill: 'var(--tu-panel)',
  stroke: 'var(--tu-rule)', 'stroke-width': 1.6 }, tb);
const rows = [
  ['PROJECT', 'TRACKUNLIMITED', 'DWG', 'TU-P0-001'],
  ['SUBJECT', 'REFERENCE LAYOUT', 'SCALE', '1:200 @ 1920px'],
  ['SOURCE', 'ReferenceLayout() · 16 seg', 'REV', 'P1'],
];
rows.forEach((r, i) => {
  const y = TBY + 26 + i * 28;
  el('line', { x1: TBX, y1: TBY + i * 35.3, x2: TBX + TBW, y2: TBY + i * 35.3,
    stroke: 'var(--tu-grid-major)', 'stroke-width': 1 }, tb);
  txt(r[0], TBX + 12, y, 'tiny', {}, tb);
  txt(r[1], TBX + 96, y, 'lbl2', { fill: 'var(--tu-text)' }, tb);
  txt(r[2], TBX + 350, y, 'tiny', {}, tb);
  txt(r[3], TBX + 412, y, 'lbl2', { fill: 'var(--tu-text)' }, tb);
});
el('line', { x1: TBX + 340, y1: TBY, x2: TBX + 340, y2: TBY + TBH,
  stroke: 'var(--tu-grid-major)', 'stroke-width': 1 }, tb);
txt('C² CONTINUOUS · VERIFIED TO 1e-9 ACROSS ALL 15 JOINTS', TBX + TBW, TBY - 14, 'tiny',
    { 'text-anchor': 'end' }, tb);

// ---------------------------------------------------------------- progress
const gProg = el('g', { class: 'fade' });
const PX0 = 96, PX1 = 1290, PY = 990;
txt('LOADING', PX0, PY - 30, 'tiny', {}, gProg);
const statusT = txt('', PX0 + 96, PY - 30, 'lbl2', { fill: 'var(--tu-text)' }, gProg);
el('line', { x1: PX0, y1: PY, x2: PX1, y2: PY, stroke: 'var(--tu-grid-major)',
  'stroke-width': 1 }, gProg);
for (let i = 0; i <= 10; i++) {
  const x = PX0 + (PX1 - PX0) * i / 10;
  el('line', { x1: x, y1: PY, x2: x, y2: PY + (i % 5 ? 6 : 11),
    stroke: 'var(--tu-grid-major)', 'stroke-width': 1 }, gProg);
}
const bar = el('line', { x1: PX0, y1: PY, x2: PX0, y2: PY, stroke: 'var(--tu-line)',
  'stroke-width': 3, 'stroke-linecap': 'butt' }, gProg);
const barTick = el('line', { x1: PX0, y1: PY - 12, x2: PX0, y2: PY + 12,
  stroke: 'var(--tu-line)', 'stroke-width': 2 }, gProg);
const pctT = txt('0%', PX0, PY - 22, 'val', { fill: 'var(--tu-line)' }, gProg);
const tipT = txt('', PX0, PY + 44, 'tiny', {}, gProg);

const TIPS = [
  'CURVATURE IS A PROPERTY OF THE DATA, NOT SOMETHING FITTED AFTERWARDS.',
  'ROLL IS MEASURED FROM THE PATH FRAME. BANK IS MEASURED FROM THE HORIZON. THEY ARE NOT THE SAME.',
  'A BLOCK DOES NOT REPORT CLEAR THE MOMENT A TRAIN LEAVES IT.',
  'GRAVITY IS AN EXACT ENERGY EXCHANGE — A FRICTIONLESS CIRCUIT CONSERVES ENERGY AT ANY TIMESTEP.',
  'THE CONTROL PANEL IS GENERATED FROM THE SAME BLOCK LIST THAT DRIVES THE PHYSICS.',
];
const STATUS = [
  [0.00, 'READING SEGMENT LIST'],
  [0.09, 'INTEGRATING CURVATURE PROFILE'],
  [0.24, 'RESOLVING HEARTLINE FRAME'],
  [0.40, 'VALIDATING C² CONTINUITY'],
  [0.55, 'BUILDING TRACK ZONES'],
  [0.68, 'RUNNING RIDE PROFILE'],
  [0.80, 'ARMING BLOCK SIGNALS'],
  [0.91, 'GENERATING CONTROL PANEL'],
  [0.995, 'READY'],
];

// ---------------------------------------------------------------- animation
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function reveal(node, delay) {
  if (STATIC || reduce) { node.classList.add('on'); return; }
  setTimeout(() => node.classList.add('on'), delay);
}
function drawIn(p, dur, delay) {
  const L = p.getTotalLength();
  if (STATIC || reduce) return;
  p.style.strokeDasharray = L; p.style.strokeDashoffset = L;
  p.style.transition = `stroke-dashoffset ${dur}ms cubic-bezier(.4,0,.2,1) ${delay}ms`;
  requestAnimationFrame(() => { p.style.strokeDashoffset = 0; });
}
[gGrid, frame, head, gDatum].forEach((n, i) => reveal(n, 60 + i * 90));
let acc = 380;
paths.forEach(p => { drawIn(p, 1500, acc); acc += 60; });
reveal(gSec, 380);
reveal(gDim, 1500);
reveal(gCall, 1750);
reveal(gVocab, 1600);
reveal(gZone, 1500);
reveal(gBlocks, 1650);
reveal(gTrace, 1800);
tracePaths.forEach(p => drawIn(p, 1100, 1850));
reveal(tb, 900);
reveal(gProg, 1100);
reveal(gLive, 2100);

// progress model: not linear, because nothing real ever is
let p = 0, target = 0, tipI = 0, holdUntil = 0;
function pickTarget() {
  target = Math.min(1, p + 0.06 + Math.random() * 0.22);
  holdUntil = performance.now() + 120 + Math.random() * 520;
}
pickTarget();
tipT.textContent = TIPS[0];
setInterval(() => { if (!STATIC) { tipI = (tipI + 1) % TIPS.length; tipT.textContent = TIPS[tipI]; } }, 5200);

function statusFor(v) {
  let s = STATUS[0][1];
  for (const [t, l] of STATUS) if (v >= t) s = l;
  return s;
}
function lerp(arr, xs, s) {
  let i = 1;
  while (i < xs.length - 1 && xs[i] < s) i++;
  const t = (s - xs[i - 1]) / Math.max(1e-6, xs[i] - xs[i - 1]);
  return arr[i - 1] + (arr[i] - arr[i - 1]) * Math.max(0, Math.min(1, t));
}
function render(v) {
  const x = PX0 + (PX1 - PX0) * v;
  bar.setAttribute('x2', x);
  barTick.setAttribute('x1', x); barTick.setAttribute('x2', x);
  pctT.setAttribute('x', Math.min(PX1 - 34, x));
  pctT.textContent = Math.round(v * 100) + '%';
  statusT.textContent = statusFor(v);

  // the train is literally where loading is
  const s = v * TU.meta.developedLength;
  const X = lerp(TU.X, TU.S, s), Z = lerp(TU.Z, TU.S, s);
  const tx = px(X), ty = py(Z);
  trainG.setAttribute('transform', `translate(${tx.toFixed(1)},${ty.toFixed(1)})`);
  const flip = tx > PLOT.x1 - 260 ? -1 : 1;
  readout.setAttribute('transform',
    `translate(${tx.toFixed(1)},${ty.toFixed(1)}) ${flip < 0 ? 'translate(-208,0)' : ''}`);
  roS.textContent = 'S ' + s.toFixed(1) + ' m   H ' + Z.toFixed(1) + ' m';
  const vv = lerp(TU.V, TU.TS, s), gg = lerp(TU.G, TU.TS, s);
  roV.textContent = vv.toFixed(1) + ' km/h';
  roG.textContent = (gg >= 0 ? '+' : '') + gg.toFixed(2) + ' g';

  const cx = TR_X0 + (s / TU.meta.developedLength) * (TR_X1 - TR_X0);
  cursor.setAttribute('x1', cx); cursor.setAttribute('x2', cx);

  // block states: OCCUPIED where the train is, BUFFER for a short overlap behind
  lamps.forEach(({ lamp, st, z }) => {
    let state = 'CLEAR', col = 'var(--tu-green)', op = 0.28;
    if (s >= z.s0 && s < z.s1) { state = 'OCCUPIED'; col = 'var(--tu-red)'; op = 1; }
    else if (s >= z.s1 && s < z.s1 + 55) {
      state = 'BUFFER ' + Math.max(0, (5 - (s - z.s1) / 11)).toFixed(1);
      col = 'var(--tu-amber)'; op = 1;
    }
    lamp.setAttribute('fill', col); lamp.setAttribute('opacity', op);
    st.textContent = state;
    st.setAttribute('fill', op === 1 ? col : 'var(--tu-text-2)');
  });
}

if (STATIC) {
  render(FROZEN === null ? 1 : FROZEN);
} else {
  let last = performance.now();
  (function tick(now) {
    const dt = Math.min(64, now - last); last = now;
    if (now > holdUntil && p < target) {
      p = Math.min(target, p + dt / 1000 * (0.10 + (1 - p) * 0.30));
      if (p >= target - 1e-4 && target < 1) pickTarget();
    }
    if (p >= 0.9999) {
      p = 1;
      if (LOOP) setTimeout(() => { p = 0; target = 0; pickTarget(); }, 1600);
      else { render(1); return; }
    }
    render(p);
    requestAnimationFrame(tick);
  })(performance.now());
}
</script>
</body>
